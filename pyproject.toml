[project]
name = "all-email-in-chat"
version = "0.2.0"
description = "Configure your email once. Bring it to your desktop AI agents through MCP."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
  "mcp-email-server==1.9.1",
  "mcp>=1.29.1,<2",
  "keyring>=25,<26",
  "tomli-w>=1.2,<2",
  "tomlkit>=0.13,<1",
  "filelock>=3.20,<4",
  "jsonschema>=4.20,<5",
  "starlette>=1.7,<2",
  "uvicorn>=0.54,<1",
]

[project.scripts]
email-in-chat = "email_in_chat.cli:main"

[dependency-groups]
dev = ["pytest>=8,<9", "pytest-asyncio>=1,<2", "ruff>=0.14", "build>=1.2", "httpx>=0.28,<1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/email_in_chat"]

[tool.hatch.build]
exclude = ["/00_工作日志.md", "/local", "/.impeccable", "**/node_modules"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
