name: Tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.10.7"
          enable-cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci && npm run format:check && npm test && npm run build
        working-directory: frontend
      - run: git diff --exit-code -- src/email_in_chat/static
      - run: uv sync --locked --python 3.12
      - run: uv run ruff check src tests scripts
      - run: uv run ruff format --check src tests scripts
      - run: uv run pytest -q
      - run: uv build
      - run: python3 scripts/check_publication.py
      - run: uv run --no-project --with ./dist/all_email_in_chat-0.3.0-py3-none-any.whl python scripts/smoke_installed.py
